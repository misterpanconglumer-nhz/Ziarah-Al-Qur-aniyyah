<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142B4A" />
      <stop offset="50%" stop-color="#0E1F35" />
      <stop offset="100%" stop-color="#081220" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4BC7BE" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#236D78" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="p1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4BC7BE" />
      <stop offset="100%" stop-color="#236D78" />
    </linearGradient>
    <linearGradient id="p2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#236D78" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <linearGradient id="p3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#7CE5DE" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="210" fill="url(#glowGrad)" />

  <!-- Outer coordination ring -->
  <circle cx="256" cy="235" r="170" stroke="#4BC7BE" stroke-width="6" stroke-dasharray="14 10" opacity="0.45" />

  <!-- Transform group for central emblem -->
  <g transform="translate(68, 47) scale(3.133)">
    <!-- Main Foundation Arch / Journey Route -->
    <path d="M 24 88 C 24 50, 40 28, 60 22 C 80 28, 96 50, 96 88 C 84 84, 74 76, 60 76 C 46 76, 36 84, 24 88 Z" fill="url(#p1)" />
    
    <!-- Inner Sacred Arch / Unity Node -->
    <path d="M 36 88 C 36 62, 47 44, 60 38 C 73 44, 84 62, 84 88 C 76 83, 68 80, 60 80 C 52 80, 44 83, 36 88 Z" fill="url(#p2)" />

    <!-- Center Guidance Star / Diamond -->
    <path d="M 60 28 L 65 38 L 75 43 L 65 48 L 60 58 L 55 48 L 45 43 L 55 38 Z" fill="url(#p3)" />
    
    <!-- Cohesion Nexus Points -->
    <circle cx="60" cy="70" r="4.5" fill="#FFFFFF" />
    <circle cx="44" cy="75" r="3.5" fill="#4BC7BE" />
    <circle cx="76" cy="75" r="3.5" fill="#4BC7BE" />
    <circle cx="60" cy="85" r="2.5" fill="#236D78" />
  </g>

  <!-- Subtitle Text -->
  <text x="256" y="440" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
    ZIARAH <tspan fill="#4BC7BE">2027</tspan>
  </text>
  <text x="256" y="475" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#7CE5DE" text-anchor="middle" letter-spacing="3.5">
    AL-QUR'ANIYYAH
  </text>
</svg>
